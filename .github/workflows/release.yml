# Release 流水线：推送 v* tag 触发
# 流程：安装依赖 → 类型检查 → 测试 → 构建 → npm pack → 创建 GitHub Release 并附 .tgz 产物
# 发版约定见 AGENTS.md「Git」一节（npm version 手动发版）
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack

      # gh CLI 为 runner 预装，GITHUB_TOKEN 由 Actions 自动注入，无需额外配置 secret
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes ./*.tgz
